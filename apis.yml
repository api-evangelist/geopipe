aid: geopipe
name: Geopipe
description: >-
  Geopipe uses AI and machine learning to build game-ready digital twins of
  real-world cities and environments. It ingests raw sensor data (imagery and
  laser scans) and reconstructs regions as semantically-modeled, multi-level-of-
  detail 3D models that developers stream or download into games, simulations,
  training, architecture, and metaverse applications without any manual 3D
  modeling. Delivery is through Cesium 3D Tiles streaming for Unity and Unreal
  Engine, downloadable 3D meshes in common file formats, ready-to-use Unity
  Asset Store packs, and a first-party Unity SDK, backed by an open-source
  geospatial and 3D-tiles toolchain on GitHub. Founded in New York City by
  Christopher Mitchell and Thomas Dickerson and backed by Techstars.
